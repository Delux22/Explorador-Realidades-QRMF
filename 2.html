<!DOCTYPE html>
<html>
<head>
    <title>Realidades Alternas QRMF</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f0f1a;
            color: #e0e0ff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #00ffcc;
            text-align: center;
        }
        .reality-box {
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
            background: #1a1a2e;
        }
        canvas {
            background: #000;
            border-radius: 8px;
        }
        .controls {
          display: flex;
          justify-content: space-around;
          margin-bottom: 20px;
        }
        .controls input {
          width: 80px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1> Explorador de Realidades QRMF</h1>
        
        <div class="controls">
            <div>
                <label for="kappa">Factor kappa:</label>
                <input type="number" id="kappa" value="1">
            </div>
            <div>
                <label for="dimension">Dimensión extra:</label>
                <input type="number" id="dimension" value="0">
            </div>
        </div>

        <div class="reality-box">
            <h2>Dimensión Actual</h2>
            <canvas id="currentReality"></canvas>
            <p id="realityStats">Cargando datos cuánticos...</p>
        </div>
        
        <div class="reality-box">
            <h2>Saltos Temporales</h2>
            <canvas id="timeJumps"></canvas>
        </div>
        
        <button onclick="generateNewReality()">Generar Nueva Realidad</button>
    </div>

    <script>
        // Datos iniciales
        let currentDimension = 1;
        const timeLabels = Array.from({length: 20}, (_, i) => i+1);
        let kappa = 1;
        let extraDimension = 0;
        
        // Gráfico de realidad actual
        const ctx1 = document.getElementById('currentReality').getContext('2d');
        const realityChart = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: timeLabels,
                datasets: [{
                    label: 'Energía Cuántica',
                    data: generateQuantumData(),
                    borderColor: '#00ffcc',
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });
        
        // Gráfico de saltos temporales
        const ctx2 = document.getElementById('timeJumps').getContext('2d');
        const timeChart = new Chart(ctx2, {
            type: 'bar',
            data: {
                labels: ['Pasado', 'Presente', 'Futuro'],
                datasets: [{
                    label: 'Probabilidad',
                    data: [30, 40, 30],
                    backgroundColor: ['#ff5555', '#55ff55', '#5555ff']
                }]
            }
        });
        
        // Generador de datos cuánticos
        function generateQuantumData() {
            return timeLabels.map(t => {
                return 50 + 30 * Math.sin(t / 3 + currentDimension + kappa + extraDimension) + 5 * Math.random();
            });
        }
        
        // Actualiza la simulación
        function generateNewReality() {
            currentDimension += 1;
            kappa = parseFloat(document.getElementById('kappa').value);
            extraDimension = parseFloat(document.getElementById('dimension').value);
            realityChart.data.datasets[0].data = generateQuantumData();
            realityChart.update();
            
            // Actualiza estadísticas
            document.getElementById('realityStats').innerHTML = `
                <strong>Dimensión QRMF-${currentDimension}</strong><br>
                Frecuencia base: ${(Math.random()*100).toFixed(2)} Hz<br>
                Probabilidad de colapso: ${(Math.random()*50).toFixed(2)}%<br>
                Factor Kappa: ${kappa}<br>
                Dimensión Extra: ${extraDimension}
            `;
            
            // Actualiza saltos temporales
            timeChart.data.datasets[0].data = [
                Math.random()*50,
                Math.random()*70,
                Math.random()*60
            ];
            timeChart.update();
        }
        
        // Inicialización
        generateNewReality();
    </script>
</body>
</html>
